[project]
name = "hashiya"
version = "0.1.0"
description = "Daily work log from Jira + git; your edits are the product"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jira>=3.8",
    "python-dotenv>=1.0",
]

[project.scripts]
hashiya = "hashiya:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["hashiya.py"]
